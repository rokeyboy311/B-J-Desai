<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bina Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Central ERP and construction accounting system featuring 7 categories: Investment & Capital Allocation, Material Purchase, Material Supply, Site Supply, Labour Attendance, Master Registry, and Contractor Cost Reconciliation with unified PIN security." />
    <meta property="og:title" content="Bina Enterprise" />
    <meta property="og:description" content="Central ERP and construction accounting system featuring 7 categories: Investment & Capital Allocation, Material Purchase, Material Supply, Site Supply, Labour Attendance, Master Registry, and Contractor Cost Reconciliation with unified PIN security." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bina Enterprise" />
    <link rel="apple-touch-icon" href="/pwa-512x512.png" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body style="margin: 0; background-color: #020617;">
    <div id="root">
      <!-- Instant Loading Splash Screen (replaces white screen immediately) -->
      <div id="initial-preloader" style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f8fafc; padding: 1.5rem; text-align: center; box-sizing: border-box;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #3b82f6); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.45);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
        </div>
        <div style="font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem; color: #ffffff;">Bina Enterprise</div>
        <div style="font-size: 0.75rem; color: #818cf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.75rem;">Central ERP System</div>
        <div style="width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="initial-loading-text" style="font-size: 0.8rem; color: #64748b; margin-top: 1.25rem; font-weight: 500;">Loading System Modules...</p>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>

    <!-- Error Trap & Recovery Handler -->
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loading-text');
        if (loader && document.querySelector('#initial-preloader')) {
          loader.innerHTML = '<span style="color: #f87171;">Load issue detected. </span><button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="margin-top: 8px; padding: 6px 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: block; margin-left: auto; margin-right: auto;">Clear Cache & Reload</button>';
        }
      });
      
      // Clear legacy broken service workers if needed
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.update().catch(function(){});
          }
        }).catch(function(){});
      }
    </script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
