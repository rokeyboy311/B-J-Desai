<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B J</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Central ERP and construction accounting system featuring 7 categories: Investment & Capital Allocation, Material Purchase, Material Supply, Site Supply, Labour Attendance, Master Registry, and Contractor Cost Reconciliation with unified PIN security." />
    <meta property="og:title" content="B J" />
    <meta property="og:description" content="Central ERP and construction accounting system featuring 7 categories: Investment & Capital Allocation, Material Purchase, Material Supply, Site Supply, Labour Attendance, Master Registry, and Contractor Cost Reconciliation with unified PIN security." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="B J" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />

  </head>
  <body style="margin: 0; padding: 0; background-color: #F4F6F9; overflow: hidden; height: 100dvh;">
    <div id="root">
      <!-- Instant Loading Splash Screen (replaces white screen immediately) -->
      <div id="initial-preloader" style="min-height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f8fafc; padding: 1.5rem; text-align: center; box-sizing: border-box;">
        <div style="width: 76px; height: 76px; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; box-shadow: 0 10px 25px -5px rgba(252, 192, 1, 0.4); border: 2px solid rgba(255, 255, 255, 0.25); background-color: #ffffff; padding: 8px; box-sizing: border-box;">
          <img src="/app-icon.svg?v=2" alt="B J Logo" style="width: 100%; height: 100%; object-fit: contain; display: block;" onerror="this.onerror=null; this.src='/pwa-192x192.png';" />
        </div>
        <div style="font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem; color: #ffffff;">B J</div>
        <div style="font-size: 0.75rem; color: #818cf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.75rem;">Central ERP System</div>
        <div style="width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="initial-loading-text" style="font-size: 0.8rem; color: #64748b; margin-top: 1.25rem; font-weight: 500;">Loading System Modules...</p>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>

    <!-- Error Trap, Watchdog & Recovery Handler -->
    <script>
      (function() {
        // Aggressively unregister any service workers that could intercept requests
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister().catch(function(){});
            }
          }).catch(function(){});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name).catch(function(){});
            }
          }).catch(function(){});
        }

        window.clearAndReloadApp = function() {
          try {
            sessionStorage.clear();
            localStorage.removeItem('bd_erp_pin_token');
            localStorage.removeItem('bd_erp_category_pin_token');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var name of names) caches.delete(name);
              });
            }
          } catch(e) {}
          window.location.reload();
        };

        // Watchdog: If preloader is still visible after 3.5 seconds, provide recovery button
        var watchdogTimer = setTimeout(function() {
          var loader = document.getElementById('initial-loading-text');
          if (loader && document.getElementById('initial-preloader')) {
            loader.innerHTML = '<span style="display:block; color: #cbd5e1; margin-bottom: 8px;">Taking a few moments to initialize...</span>' +
              '<button onclick="clearAndReloadApp()" style="padding: 7px 16px; background: #4f46e5; color: #ffffff; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-block;">Refresh App</button>';
          }
        }, 3500);

        function handleAppError(msg) {
          clearTimeout(watchdogTimer);
          var loader = document.getElementById('initial-loading-text');
          if (loader && document.getElementById('initial-preloader')) {
            loader.innerHTML = '<span style="color: #f87171; display: block; margin-bottom: 8px;">Module initialization paused</span>' +
              '<button onclick="clearAndReloadApp()" style="padding: 7px 16px; background: #4f46e5; color: #ffffff; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">Clear Cache & Reload</button>';
          }
        }

        window.addEventListener('error', function(e) {
          handleAppError(e.message);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && String(e.reason).includes('WebSocket')) return;
          handleAppError(e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
