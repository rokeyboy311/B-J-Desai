    <script>
      // Filter benign Vite HMR websocket notice in AI Studio preview environment
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('failed to connect to websocket') || args[0] === '[vite]')) {
            return;
          }
          _origError.apply(console, args);
        };
      })();
    </script>
